# Настройки Streamlit для этого проекта.
# address = "localhost" — сервер отвечает только на запросы с этого же
# компьютера, Network URL (доступ с других устройств в Wi-Fi) не появляется.
[server]
address = "localhost"

# Отключаем отправку анонимной статистики использования на серверы Streamlit —
# для институционального проекта лишний внешний сетевой вызов ни к чему,
# даже если он анонимный и не содержит данных лекций или ключей.
[browser]
gatherUsageStats = false

# Фирменная палитра ИМЭС: оранжевый #FC4D0F, чёрный, белый.
[theme]
primaryColor = "#FC4D0F"
backgroundColor = "#0D0D0D"
secondaryBackgroundColor = "#1A1A1A"
textColor = "#FAFAFA"
font = "sans serif"